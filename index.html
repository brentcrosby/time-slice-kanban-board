<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasky</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("kanban-theme");
          const dark = preference === "dark" ||
            (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          const color = dark ? "#191919" : "#ffffff";
          document.documentElement.dataset.taskyTheme = dark ? "dark" : "light";
          document.documentElement.style.backgroundColor = color;
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').content = color;
          document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = dark ? "black" : "default";
        } catch { /* Keep the light launch appearance when storage is unavailable. */ }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon-kanban.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-kanban-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png?v=2" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest?v=2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
