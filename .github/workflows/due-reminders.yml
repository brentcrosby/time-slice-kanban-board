name: Morning due reminders

on:
  schedule:
    # Several chances per hour avoid the busiest minute and tolerate delays.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tasky-due-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install reminder dependencies
        run: npm ci --prefix reminders --ignore-scripts
      - name: Send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.TASKY_FIREBASE_SERVICE_ACCOUNT_JSON }}
          VAPID_PUBLIC_KEY: ${{ secrets.TASKY_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.TASKY_VAPID_PRIVATE_KEY }}
        run: node reminders/index.js
